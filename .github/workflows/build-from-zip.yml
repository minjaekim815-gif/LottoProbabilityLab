name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unzip project
        run: |
          mkdir extracted
          unzip -q LottoProbabilityLab_v0.8_final_source.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Adjust SDK version for CI
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/targetSdk = 37/targetSdk = 36/g' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LottoProbabilityLab-v0.8-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
